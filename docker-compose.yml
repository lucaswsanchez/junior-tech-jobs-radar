# Local stack: PostgreSQL + the ETL pipeline + the dashboard dev server.
#   docker compose up --build
# Dashboard: http://localhost:5173 · Postgres: localhost:5432 (postgres/postgres)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobs_radar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobs_radar"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/jobs_radar
      REQUEST_DELAY_SECONDS: "1.0"
      LOG_LEVEL: INFO
    # Writes the refreshed JSON snapshot into the dashboard's public folder.
    volumes:
      - ./web/public/data:/app/web/public/data
    user: root

  web:
    image: node:22-alpine
    working_dir: /web
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./web:/web
      - /web/node_modules

volumes:
  pgdata:
